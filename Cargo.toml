[workspace]
resolver = "2"
members = ["crates/sdeck-core", "crates/sdeck", "crates/fake-agent"]

[workspace.package]
version = "0.10.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
