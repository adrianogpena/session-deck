[package]
name = "sdeck"
version.workspace = true
edition.workspace = true

[dependencies]
sdeck-core = { path = "../sdeck-core" }
anyhow = "1"
ratatui = "0.30.2"
crossterm = "0.29.0"
unicode-width = "0.2.2"
regex = "1.13.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
indexmap = "2"
portable-pty = "0.9.0"
vt100 = "0.16.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
